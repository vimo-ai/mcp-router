name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get latest build number and increment
        id: build_number
        run: |
          # Get latest build number from appcast.xml
          APPCAST_URL="https://vimo-ai.github.io/mcp-router/appcast.xml"
          LATEST_BUILD=$(curl -s "$APPCAST_URL" | grep -o '<sparkle:version>[0-9]*</sparkle:version>' | head -1 | sed 's/<[^>]*>//g' || echo "0")

          # Validate that it's a number
          if ! [[ "$LATEST_BUILD" =~ ^[0-9]+$ ]]; then
            echo "⚠️  Failed to get valid build number from appcast.xml, using 0"
            LATEST_BUILD=0
          fi

          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "BUILD_NUMBER=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "📦 Latest build: $LATEST_BUILD, New build: $NEW_BUILD"

      # Build Rust core for both architectures
      - name: Build Rust Core (arm64)
        run: |
          cd core
          cargo build --release --target aarch64-apple-darwin

      - name: Build Rust Core (x86_64)
        run: |
          cd core
          cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p build/lib
          lipo -create \
            core/target/aarch64-apple-darwin/release/libmcp_router_core.dylib \
            core/target/x86_64-apple-darwin/release/libmcp_router_core.dylib \
            -output build/lib/libmcp_router_core.dylib

          # Copy header file
          cp core/include/mcp_router_core.h build/lib/

          # Create module.modulemap (MCPRouterCore matches Swift import naming)
          cat > build/lib/module.modulemap <<'EOF'
          module MCPRouterCore {
              header "mcp_router_core.h"
              export *
          }
          EOF

          echo "✅ Universal binary created"
          file build/lib/libmcp_router_core.dylib
          ls -la build/lib/

      # Copy dylib to Swift project for build
      - name: Prepare dylib for Swift build
        run: |
          cp build/lib/libmcp_router_core.dylib mcp-router/Lib/
          cp build/lib/mcp_router_core.h mcp-router/Lib/
          install_name_tool -id "@rpath/libmcp_router_core.dylib" mcp-router/Lib/libmcp_router_core.dylib
          ls -la mcp-router/Lib/

      # Package dylib for release (rename to mcp_router_core for MCPRouterKit compatibility)
      - name: Package Dylib
        run: |
          cd build/lib
          # Rename to mcp_router_core (expected format for MCPRouterKit)
          cp libmcp_router_core.dylib mcp_router_core
          zip -r ../mcp_router_core-${{ steps.version.outputs.VERSION }}-macos-universal.zip \
            mcp_router_core mcp_router_core.h module.modulemap

      - name: Build App
        run: |
          xcodebuild -project mcp-router.xcodeproj \
                     -scheme mcp-router \
                     -configuration Release \
                     -archivePath build/mcp-router.xcarchive \
                     -destination 'generic/platform=macOS' \
                     CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.BUILD_NUMBER }} \
                     MARKETING_VERSION=${{ steps.version.outputs.VERSION }} \
                     CODE_SIGN_IDENTITY="-" \
                     archive

          # Copy app and perform adhoc signing
          cp -R build/mcp-router.xcarchive/Products/Applications/mcp-router.app build/

          # Verify version number
          echo "Verifying build version..."
          plutil -p build/mcp-router.app/Contents/Info.plist | grep -E "CFBundleVersion|CFBundleShortVersionString"

          # Perform adhoc signing
          echo "🔏 Performing adhoc signing..."
          codesign --sign - --force --deep --timestamp build/mcp-router.app

          # Verify signature
          echo "✅ Signature verification:"
          codesign --verify --deep --strict --verbose=2 build/mcp-router.app

      - name: Create App ZIP
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent mcp-router.app mcp-router-${{ steps.version.outputs.VERSION }}.zip

      - name: Download Sparkle Tools
        run: |
          curl -LO https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
          tar -xf Sparkle-2.6.4.tar.xz

      - name: Sign Update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.DEPLOY }}
        run: |
          # Use Sparkle's signing tool
          FULL_OUTPUT=$(echo "$SPARKLE_PRIVATE_KEY" | ./bin/sign_update -f - build/mcp-router-${{ steps.version.outputs.VERSION }}.zip)
          # Extract signature value (remove sparkle:edSignature= prefix and quotes)
          SIGNATURE=$(echo "$FULL_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          echo "SIGNATURE=$SIGNATURE" >> $GITHUB_ENV
          echo "Signature: $SIGNATURE"

      - name: Get ZIP size
        id: zip_size
        run: |
          SIZE=$(stat -f%z "build/mcp-router-${{ steps.version.outputs.VERSION }}.zip")
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "ZIP Size: $SIZE bytes"

      - name: Update appcast.xml
        run: |
          # Auto-detect if this is a beta version
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD_NUMBER="${{ steps.build_number.outputs.BUILD_NUMBER }}"
          CHANNEL=""

          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            CHANNEL='<sparkle:channel>beta</sparkle:channel>'
            echo "🚧 Pre-release version detected, adding beta channel"
          else
            echo "✅ Stable version, using default channel"
          fi

          # Create new item
          cat > new_item.xml <<EOF
          <item>
              <title>Version $VERSION</title>
              <sparkle:version>$BUILD_NUMBER</sparkle:version>
              <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
              $CHANNEL
              <pubDate>$(date -R)</pubDate>
              <description><![CDATA[
                  <h2>What's New</h2>
                  <p>Check the <a href="https://github.com/vimo-ai/mcp-router/releases/tag/v$VERSION">release notes</a> for details.</p>
              ]]></description>
              <enclosure
                  url="https://github.com/vimo-ai/mcp-router/releases/download/v$VERSION/mcp-router-$VERSION.zip"
                  sparkle:edSignature="${{ env.SIGNATURE }}"
                  length="${{ steps.zip_size.outputs.SIZE }}"
                  type="application/octet-stream"
                  sparkle:version="$BUILD_NUMBER"
                  sparkle:shortVersionString="$VERSION" />
              <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
          </item>
          EOF

          # Create appcast.xml if it doesn't exist
          if [ ! -f appcast.xml ]; then
            cat > appcast.xml <<'APPCAST'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>MCP Router Updates</title>
                  <language>en</language>
                  <description>Updates for MCP Router</description>
                  <link>https://github.com/vimo-ai/mcp-router</link>
              </channel>
          </rss>
          APPCAST
          fi

          # Insert new item into channel (before </channel>)
          python3 << 'PYTHON_SCRIPT'
          with open('appcast.xml', 'r') as f:
              content = f.read()
          with open('new_item.xml', 'r') as f:
              new_item = f.read()
          # Insert new item before </channel>
          content = content.replace('    </channel>', new_item + '\n    </channel>')
          with open('appcast.xml', 'w') as f:
              f.write(content)
          PYTHON_SCRIPT

      - name: Deploy appcast.xml to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          destination_dir: .
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/mcp-router-${{ steps.version.outputs.VERSION }}.zip
            build/mcp_router_core-${{ steps.version.outputs.VERSION }}-macos-universal.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
