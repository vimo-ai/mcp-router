name: Test Build

on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build-rust-core:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Rust Core (arm64)
        run: |
          cd core
          cargo build --release --target aarch64-apple-darwin

      - name: Build Rust Core (x86_64)
        run: |
          cd core
          cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p build/lib
          lipo -create \
            core/target/aarch64-apple-darwin/release/libmcp_router_core.dylib \
            core/target/x86_64-apple-darwin/release/libmcp_router_core.dylib \
            -output build/lib/libmcp_router_core.dylib

          echo "✅ Universal binary created"
          file build/lib/libmcp_router_core.dylib
          ls -la build/lib/

      - name: Run Rust Tests
        run: |
          cd core
          cargo test

  build-swift-app:
    runs-on: macos-26
    needs: build-rust-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Build App (check only)
        run: |
          xcodebuild -project mcp-router.xcodeproj \
                     -scheme mcp-router \
                     -configuration Release \
                     -destination 'generic/platform=macOS' \
                     CODE_SIGN_IDENTITY="-" \
                     build
