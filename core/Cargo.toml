[package]
name = "mcp-router-core"
version = "0.1.0"
edition = "2021"
description = "MCP Router Core - Multi-server MCP proxy with workspace isolation"
license = "MIT"

[lib]
# dylib: 动态库，可被 Swift 通过 dlopen 加载
# rlib: Rust 库，供其他 Rust crate 使用
crate-type = ["cdylib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP Server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# MCP Protocol (official Rust SDK)
# mcp-rust-sdk = "0.1"  # TODO: uncomment when available on crates.io
# For now, implement protocol manually

# JSON-RPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Process management - tokio has built-in process support
# No additional crate needed, using tokio::process

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"

# FFI
libc = "0.2"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
panic = "abort"

# 开发时的快速编译 profile（与 sugarloaf-ffi 保持一致）
[profile.dev-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = "symbols"
debug = "line-tables-only"
panic = "abort"
