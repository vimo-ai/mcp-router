# cbindgen configuration for generating C headers

language = "C"
header = "// MCP Router Core - FFI Header\n// Auto-generated by cbindgen, do not edit manually"
include_guard = "MCP_ROUTER_CORE_H"
style = "both"
usize_is_size_t = true

[export]
include = ["FfiResult", "McpRouterHandle"]
exclude = []

[defines]
"target_os = macos" = "TARGET_OS_MAC"
"target_os = ios" = "TARGET_OS_IPHONE"

[fn]
rename_args = "None"

[struct]
derive_eq = true
derive_neq = true

[enum]
rename_variants = "ScreamingSnakeCase"
